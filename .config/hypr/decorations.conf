$color2 = 0x000000

source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 2
    gaps_out = 3
    resize_on_border = true
    border_size = 2
    col.active_border = $color6 $color5
    col.inactive_border = 0x00000000
}

decoration {
    rounding = 12

    active_opacity = 0.85
    inactive_opacity = 0.65

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = false
        ignore_window = true
        offset = 0 0
        range = 10
        render_power = 5
        color = 0x88404040
    }
}
