source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = $color1 $color4
    no_border_on_floating = false
}

decoration {
    rounding = 8

    active_opacity = 0.95
    inactive_opacity = 0.7

    blur {
        enabled = true
        size = 2
        passes = 2
        new_optimizations = true
        xray = true
        ignore_opacity = false
    }

    shadow {
        enabled = false
        ignore_window = true
        offset = 0 0
        range = 10
        render_power = 5
        color = 0x88404040
    }
}
